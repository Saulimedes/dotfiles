general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1200
    # Only auto-suspend on battery; on AC (e.g. while used headless over SSH)
    # idling shouldn't suspend the machine.
    on-timeout = sh -c 'on_ac=$(cat /sys/class/power_supply/A*/online 2>/dev/null); [ "$on_ac" = "1" ] || systemctl suspend'
}
