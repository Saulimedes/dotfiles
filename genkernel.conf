# genkernel configuration - managed by chezmoi
# Only overrides from defaults are listed here.

NOCOLOR="false"

# LUKS-encrypted NVMe root.
# NVMe and DM-Crypt may be built as modules; include them in the initramfs.
LUKS="yes"
RAMDISKMODULES="yes"

# Bundle AMD microcode into the initramfs (Limine doesn't auto-load separate uc.img)
MICROCODE="amd"
MICROCODE_INITRAMFS="yes"

MAKEOPTS="$(portageq envvar MAKEOPTS)"

GK_SHARE="${GK_SHARE:-/usr/share/genkernel}"
CACHE_DIR="/var/cache/genkernel"
DISTDIR="${GK_SHARE}/distfiles"
LOGFILE="/var/log/genkernel.log"
LOGLEVEL=1
DEFAULT_KERNEL_SOURCE="/usr/src/linux"
