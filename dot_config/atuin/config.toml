ctrl_n_shortcuts = false
search_mode = "fuzzy"
filter_mode = "session-preload"
# Only the bash up-arrow uses this (zsh and fish init with --disable-up-arrow)
filter_mode_shell_up_key_binding = "directory"
workspaces = true
style = "compact"
auto_sync = true
store_failed = false
sync_address = "https://atuin.lan.becker.kiwi"
sync_frequency = "6h"
secrets_filter = true
show_preview = true
show_help = false
inline_height = 20
word_jump_mode = "emacs"

# Never record these (unanchored regexes). The old top-level `ignored_commands`
# only exists under [stats] and did not stop recording.
history_filter = [
  "^(cd|zoxide|ls|eza|nvim|ydl|ll|la|l|cdi|sync)( |$)",
]

[search]
# Ctrl-R again cycles through these, in this order (workspace is skipped
# outside a git repo)
filters = ["session-preload", "directory", "workspace", "host", "global"]
# Show commands from every shell, not only the current one, so zsh and fish
# share Ctrl-R results ("auto" hides what the other shell recorded)
shells = "all"
